<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle, Quo Vadis. Redux</title>
  <meta name="description" content="A finite-potential-well sibling to Particle, Quo Vadis? A teaching tool for chemistry students covering ionisation, bound vs continuum states, and wavefunction leakage." />
  <meta name="author" content="Pierre Kennepohl" />
  <link rel="license" href="https://github.com/The-Kennepohl-Group/ParticleQuoVadisRedux/blob/main/LICENSE" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #0e1320; }
    body { font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9aa0b4; font-family: 'JetBrains Mono', monospace; font-size: 14px;
    }
    #error {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      color: #e8745a; font-family: 'JetBrains Mono', monospace; font-size: 13px;
      padding: 24px; text-align: center; line-height: 1.5; max-width: 700px; margin: 0 auto;
    }
  </style>

  <!-- React and ReactDOM as UMD globals (no module system needed) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel-standalone compiles the JSX at runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <div id="loading">Loading simulation…</div>
  </div>
  <div id="error"></div>

  <!-- Attribution footer. Outside #root so the React render never clears it;
       this is the credit visible to people who only ever use the deployed
       app and never see the repository. -->
  <footer style="background:#0e1320;color:#9aa0b4;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;text-align:center;padding:26px 16px 36px;border-top:1px solid #232a40;">
    <div style="max-width:760px;margin:0 auto;">
      <div style="color:#e9e4d4;">Particle, Quo Vadis. Redux — v0.9.0</div>
      <div>© 2026 Pierre Kennepohl, University of Calgary</div>
      <div>
        Code <a href="https://github.com/The-Kennepohl-Group/ParticleQuoVadisRedux/blob/main/LICENSE" style="color:#7adfd0;">MIT</a>
        · Docs <a href="https://github.com/The-Kennepohl-Group/ParticleQuoVadisRedux/blob/main/LICENSE-docs" style="color:#7adfd0;">CC-BY-SA 4.0</a>
        · <a href="https://github.com/The-Kennepohl-Group/ParticleQuoVadisRedux" style="color:#7adfd0;">Source &amp; how to cite</a>
      </div>
      <div style="color:#6b7185;margin-top:6px;">
        Developed with AI assistance (Claude, Anthropic); the physics, design, and pedagogy are the author's.
      </div>
    </div>
  </footer>

  <!--
    The simulation source lives in src/ParticleQuoVadisRedux.js for easy reading
    and editing. Babel-standalone compiles the JSX in the browser at load time.
    No build step needed.

    Dev cache-bust: the inline script below appends ?v=<page-load-time> to the
    source URL so an edit-and-refresh cycle always pulls the fresh file rather
    than a stale HTTP-cached copy. Harmless in production — the static host's
    own URL cache still kicks in on the index.html request.
  -->
  <script>
    document.write(
      '<script type="text/babel" data-presets="react" src="./src/ParticleQuoVadisRedux.js?v=' +
      Date.now() + '"><\/script>'
    );
  </script>

  <!-- Mount the app once Babel has compiled the JSX above -->
  <script type="text/babel" data-presets="react">
    function tryMount() {
      if (typeof ParticleQuoVadisRedux === 'function') {
        const loading = document.getElementById('loading');
        if (loading) loading.remove();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ParticleQuoVadisRedux />);
      } else {
        setTimeout(tryMount, 50);
      }
    }
    tryMount();
  </script>

  <script>
    setTimeout(() => {
      const root = document.getElementById('root');
      if (root && root.firstElementChild && root.firstElementChild.id === 'loading') {
        const loading = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        if (loading) loading.style.display = 'none';
        if (errorEl) {
          errorEl.style.display = 'flex';
          errorEl.innerHTML = 'The simulation did not load. Likely causes:<br><br>' +
            '&bull; Slow or blocked CDN (React or Babel from unpkg.com)<br>' +
            '&bull; The JSX source file is missing or moved<br>' +
            '&bull; A JavaScript error — open the browser console (F12) for details';
        }
      }
    }, 8000);
    window.addEventListener('error', (e) => {
      console.error('Load error:', e.message, e.filename, e.lineno);
    });
  </script>
</body>
</html>
